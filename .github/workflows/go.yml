# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: install MinGW
      run: choco install mingw -y
    
    - name: Add MinGW to PATH
      run: echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> $env:GITHUB_PATH

    - name: Enable CGO
      run: |
        echo "CGO_ENABLED=1" >> $env:GITHUB_ENV
        echo "CC=gcc" >> $env:GITHUB_ENV
        echo "GOOS=windows" >> $env:GITHUB_ENV
        echo "GOARCH=amd64" >> $env:GITHUB_ENV

    - name: Build sim.exe
      run: go build -v -o sim.exe ./cmd/engine

    - name: Test
      run: go test -v ./...
